<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Week 16: Final Project / Final Test</title><desc id="desc">Integrate the full course in a University Learning Management System. Key concepts and a learning flow for this OOP course module.</desc><rect width="1600" height="1000" fill="#F8FAFC"/><rect width="1600" height="220" fill="#0F172A"/><rect x="0" y="0" width="18" height="220" fill="#0F766E"/><text x="70" y="62" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#0F766E">OBJECT-ORIENTED PROGRAMMING · PYTHON</text><rect x="1345" y="42" width="170" height="58" rx="29" fill="#0F766E"/><text x="1430" y="80" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">WEEK 16</text><text x="70" y="118" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="44" font-weight="800" fill="#FFFFFF">Final Project / Final Test</text><text x="70" y="195" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#CBD5E1">Integrate the full course in a University Learning Management System</text><text x="70" y="270" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="800" fill="#334155">KEY CONCEPTS</text><g><rect x="70" y="300" width="410" height="180" rx="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><rect x="70" y="300" width="8" height="180" rx="4" fill="#0F766E"/><text x="100" y="345" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#0F172A">Capstone</text><text x="100" y="382" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" fill="#475569">Model learners, staff, courses, enrollment,</text><text x="100" y="409" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" fill="#475569">assignments, submissions, status, and grading.</text></g><g><rect x="520" y="300" width="410" height="180" rx="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><rect x="520" y="300" width="8" height="180" rx="4" fill="#0F766E"/><text x="550" y="345" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#0F172A">Full OOP Evidence</text><text x="550" y="382" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" fill="#475569">Show responsibilities, relationships,</text><text x="550" y="409" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" fill="#475569">encapsulation, polymorphism, contracts,</text><text x="550" y="436" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" fill="#475569">exceptions, and tests.</text></g><g><rect x="70" y="520" width="410" height="180" rx="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><rect x="70" y="520" width="8" height="180" rx="4" fill="#0F766E"/><text x="100" y="565" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#0F172A">Workflow</text><text x="100" y="602" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" fill="#475569">Requirement → OOA → OOD → Class Diagram → OOP</text><text x="100" y="629" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" fill="#475569">→ OOT → Demo / Viva.</text></g><g><rect x="520" y="520" width="410" height="180" rx="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><rect x="520" y="520" width="8" height="180" rx="4" fill="#0F766E"/><text x="550" y="565" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#0F172A">Keep It Focused</text><text x="550" y="602" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" fill="#475569">An in-memory Python solution is enough; web</text><text x="550" y="629" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" fill="#475569">UI, database, REST API, auth, and deployment</text><text x="550" y="656" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" fill="#475569">are not required.</text></g><text x="1045" y="270" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="800" fill="#334155">MENTAL MODEL / FLOW</text><g><rect x="1045" y="320" width="470" height="51" rx="16" fill="#0F766E" stroke="#0F766E" stroke-width="2"/><circle cx="1080" cy="345.5" r="16" fill="#FFFFFF"/><text x="1080" y="351.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="800" fill="#0F766E">1</text><text x="1112" y="352.5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#FFFFFF">Requirement</text></g><g><rect x="1045" y="379" width="470" height="51" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><circle cx="1080" cy="404.5" r="16" fill="#0F766E"/><text x="1080" y="410.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">2</text><text x="1112" y="411.5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#1E293B">OOA</text></g><g><rect x="1045" y="438" width="470" height="51" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><circle cx="1080" cy="463.5" r="16" fill="#0F766E"/><text x="1080" y="469.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">3</text><text x="1112" y="470.5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#1E293B">OOD</text></g><g><rect x="1045" y="497" width="470" height="51" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><circle cx="1080" cy="522.5" r="16" fill="#0F766E"/><text x="1080" y="528.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">4</text><text x="1112" y="529.5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#1E293B">Diagram</text></g><g><rect x="1045" y="556" width="470" height="51" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><circle cx="1080" cy="581.5" r="16" fill="#0F766E"/><text x="1080" y="587.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">5</text><text x="1112" y="588.5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#1E293B">OOP</text></g><g><rect x="1045" y="615" width="470" height="51" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><circle cx="1080" cy="640.5" r="16" fill="#0F766E"/><text x="1080" y="646.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">6</text><text x="1112" y="647.5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#1E293B">OOT</text></g><g><rect x="1045" y="674" width="470" height="51" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><circle cx="1080" cy="699.5" r="16" fill="#0F766E"/><text x="1080" y="705.5" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">7</text><text x="1112" y="706.5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#1E293B">Demo / Viva</text></g><rect x="70" y="760" width="1445" height="150" rx="28" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><rect x="70" y="760" width="14" height="150" rx="7" fill="#0F766E"/><text x="110" y="805" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800" fill="#0F766E">PRACTICE FOCUS</text><text x="110" y="845" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="500" fill="#334155">The goal is not the largest program. Make every object, relationship, rule, test, and design</text><text x="110" y="877" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="500" fill="#334155">decision explainable.</text><text x="70" y="964" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#64748B">oop-course · Module 16 · Course references: Inggriani Liem + OpenStax</text><text x="1515" y="964" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#64748B">bofandra/oop-course</text></svg>