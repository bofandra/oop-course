name: Technical / execution issue
description: Report notebook, link, validator, or repository execution problems
title: "[Technical] "
labels: []
body:
  - type: textarea
    id: location
    attributes:
      label: File, notebook, or link
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed result
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: For example Google Colab, Python 3.12, browser, or operating system.
