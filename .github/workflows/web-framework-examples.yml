name: Test optional web framework examples

on:
  push:
    paths:
      - "examples/web-frameworks/**"
      - ".github/workflows/web-framework-examples.yml"
  pull_request:
    paths:
      - "examples/web-frameworks/**"
      - ".github/workflows/web-framework-examples.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.12 / ${{ matrix.framework }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        framework: [fastapi, flask, django]
    defaults:
      run:
        working-directory: examples/web-frameworks/${{ matrix.framework }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test FastAPI and Flask
        if: matrix.framework != 'django'
        run: python -m unittest discover -s tests -v
      - name: Test Django and migrations
        if: matrix.framework == 'django'
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py test books -v 2
