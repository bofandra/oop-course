<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Week 10: Multiple Inheritance &amp; Mixins</title>
  <desc id="desc">Combine capabilities carefully and understand Python's method lookup order. Key concepts and a learning flow for this OOP course module.</desc>
  <rect width="1600" height="1000" fill="#F8FAFC"/>
  <rect width="1600" height="220" fill="#0F172A"/>
  <rect x="0" y="0" width="18" height="220" fill="#7C3AED"/>
  <text x="70" y="62" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#7C3AED">OBJECT-ORIENTED PROGRAMMING · PYTHON</text>
  <rect x="1345" y="42" width="170" height="58" rx="29" fill="#7C3AED"/>
  <text x="1430" y="80" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">WEEK 10</text>
  <text x="70" y="118" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="44" font-weight="800" fill="#FFFFFF">Multiple Inheritance &amp; Mixins</text>
  <text x="70" y="195" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#CBD5E1">Combine capabilities carefully and understand Python's method lookup</text><text x="70" y="221" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#CBD5E1">order</text>
  <text x="70" y="270" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="800" fill="#334155">KEY CONCEPTS</text>
  <g>
      <rect x="70" y="300" width="410" height="180" rx="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
      <rect x="70" y="300" width="8" height="180" rx="4" fill="#7C3AED"/>
      <text x="100" y="345" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#0F172A">Multiple Inheritance</text>
      <text x="100" y="382" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#475569">A class can inherit from more than one parent,</text><text x="100" y="409" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#475569">creating more complex lookup relationships.</text>
    </g><g>
      <rect x="520" y="300" width="410" height="180" rx="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
      <rect x="520" y="300" width="8" height="180" rx="4" fill="#7C3AED"/>
      <text x="550" y="345" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#0F172A">Conflicts</text>
      <text x="550" y="382" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#475569">Parents may define the same method name, so</text><text x="550" y="409" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#475569">method selection must be predictable.</text>
    </g><g>
      <rect x="70" y="520" width="410" height="180" rx="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
      <rect x="70" y="520" width="8" height="180" rx="4" fill="#7C3AED"/>
      <text x="100" y="565" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#0F172A">MRO</text>
      <text x="100" y="602" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#475569">Python's Method Resolution Order defines the</text><text x="100" y="629" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#475569">exact path used to search for methods.</text>
    </g><g>
      <rect x="520" y="520" width="410" height="180" rx="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
      <rect x="520" y="520" width="8" height="180" rx="4" fill="#7C3AED"/>
      <text x="550" y="565" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#0F172A">Mixins</text>
      <text x="550" y="602" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#475569">Use small capability-oriented mixins; prefer</text><text x="550" y="629" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#475569">simpler single inheritance or composition when</text><text x="550" y="656" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#475569">clearer.</text>
    </g>
  <text x="1045" y="270" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="800" fill="#334155">MENTAL MODEL / FLOW</text>
  <g>
      <rect x="1045" y="335" width="470" height="64" rx="18" fill="#7C3AED" stroke="#7C3AED" stroke-width="2"/>
      <circle cx="1080" cy="367" r="17" fill="#FFFFFF" opacity="0.95"/>
      <text x="1080" y="373" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="800" fill="#7C3AED">1</text>
      <text x="1112" y="374" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#FFFFFF">Primary class</text>
    </g><g>
      <rect x="1045" y="409" width="470" height="64" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
      <circle cx="1080" cy="441" r="17" fill="#7C3AED" opacity="1"/>
      <text x="1080" y="447" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">2</text>
      <text x="1112" y="448" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#1E293B">+ Mixins</text>
    </g><g>
      <rect x="1045" y="483" width="470" height="64" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
      <circle cx="1080" cy="515" r="17" fill="#7C3AED" opacity="1"/>
      <text x="1080" y="521" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">3</text>
      <text x="1112" y="522" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#1E293B">Inspect MRO</text>
    </g><g>
      <rect x="1045" y="557" width="470" height="64" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
      <circle cx="1080" cy="589" r="17" fill="#7C3AED" opacity="1"/>
      <text x="1080" y="595" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">4</text>
      <text x="1112" y="596" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#1E293B">Resolved behavior</text>
    </g>
  <rect x="70" y="760" width="1445" height="150" rx="28" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="70" y="760" width="14" height="150" rx="7" fill="#7C3AED"/>
  <text x="110" y="805" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800" fill="#7C3AED">PRACTICE FOCUS</text>
  <text x="110" y="845" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="500" fill="#334155">Use __mro__ to explain which method wins, and justify every additional parent class.</text>
  <text x="70" y="964" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#64748B">oop-course · Module 10 · Course references: Inggriani Liem + OpenStax</text>
  <text x="1515" y="964" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#64748B">bofandra/oop-course</text>
  </svg>