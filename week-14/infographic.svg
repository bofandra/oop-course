<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Week 14: OOP Analysis, Design, Class Diagram &amp; Testing</title><desc id="desc">Trace a requirement all the way from analysis to tested Python behavior. Key concepts and a learning flow for this OOP course module.</desc><rect width="1600" height="1000" fill="#F8FAFC"/><rect width="1600" height="220" fill="#0F172A"/><rect x="0" y="0" width="18" height="220" fill="#059669"/><text x="70" y="62" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#059669">OBJECT-ORIENTED PROGRAMMING · PYTHON</text><rect x="1345" y="42" width="170" height="58" rx="29" fill="#059669"/><text x="1430" y="80" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">WEEK 14</text><text x="70" y="118" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="44" font-weight="800" fill="#FFFFFF">OOP Analysis, Design, Class Diagram &amp;</text><text x="70" y="167" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="44" font-weight="800" fill="#FFFFFF">Testing</text><text x="70" y="195" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#CBD5E1">Trace a requirement all the way from analysis to tested Python</text><text x="70" y="221" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#CBD5E1">behavior</text><text x="70" y="270" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="800" fill="#334155">KEY CONCEPTS</text><g><rect x="70" y="300" width="410" height="180" rx="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><rect x="70" y="300" width="8" height="180" rx="4" fill="#059669"/><text x="100" y="345" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#0F172A">OOA</text><text x="100" y="382" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" fill="#475569">Identify candidate objects, responsibilities,</text><text x="100" y="409" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" fill="#475569">state, behavior, and relationships from</text><text x="100" y="436" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" fill="#475569">requirements.</text></g><g><rect x="520" y="300" width="410" height="180" rx="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><rect x="520" y="300" width="8" height="180" rx="4" fill="#059669"/><text x="550" y="345" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#0F172A">OOD</text><text x="550" y="382" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" fill="#475569">Refine analysis into concrete class</text><text x="550" y="409" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" fill="#475569">interfaces, collaborations, and implementation</text><text x="550" y="436" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" fill="#475569">decisions.</text></g><g><rect x="70" y="520" width="410" height="180" rx="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><rect x="70" y="520" width="8" height="180" rx="4" fill="#059669"/><text x="100" y="565" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#0F172A">Class Diagram</text><text x="100" y="602" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" fill="#475569">Use a minimal diagram to communicate classes</text><text x="100" y="629" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" fill="#475569">and the relationships that matter.</text></g><g><rect x="520" y="520" width="410" height="180" rx="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><rect x="520" y="520" width="8" height="180" rx="4" fill="#059669"/><text x="550" y="565" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#0F172A">OOT</text><text x="550" y="602" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" fill="#475569">Test independent classes, collaborating</text><text x="550" y="629" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" fill="#475569">objects, contracts, and at least one</text><text x="550" y="656" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" fill="#475569">end-to-end scenario.</text></g><text x="1045" y="270" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="800" fill="#334155">MENTAL MODEL / FLOW</text><g><rect x="1045" y="320" width="470" height="56" rx="16" fill="#059669" stroke="#059669" stroke-width="2"/><circle cx="1080" cy="348" r="16" fill="#FFFFFF"/><text x="1080" y="354" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="800" fill="#059669">1</text><text x="1112" y="355" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#FFFFFF">Requirement</text></g><g><rect x="1045" y="384" width="470" height="56" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><circle cx="1080" cy="412" r="16" fill="#059669"/><text x="1080" y="418" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">2</text><text x="1112" y="419" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#1E293B">OOA</text></g><g><rect x="1045" y="448" width="470" height="56" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><circle cx="1080" cy="476" r="16" fill="#059669"/><text x="1080" y="482" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">3</text><text x="1112" y="483" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#1E293B">OOD</text></g><g><rect x="1045" y="512" width="470" height="56" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><circle cx="1080" cy="540" r="16" fill="#059669"/><text x="1080" y="546" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">4</text><text x="1112" y="547" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#1E293B">Class diagram</text></g><g><rect x="1045" y="576" width="470" height="56" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><circle cx="1080" cy="604" r="16" fill="#059669"/><text x="1080" y="610" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">5</text><text x="1112" y="611" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#1E293B">OOP</text></g><g><rect x="1045" y="640" width="470" height="56" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><circle cx="1080" cy="668" r="16" fill="#059669"/><text x="1080" y="674" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">6</text><text x="1112" y="675" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#1E293B">OOT</text></g><rect x="70" y="760" width="1445" height="150" rx="28" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/><rect x="70" y="760" width="14" height="150" rx="7" fill="#059669"/><text x="110" y="805" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800" fill="#059669">PRACTICE FOCUS</text><text x="110" y="845" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="500" fill="#334155">Use the Clinic Appointment case to keep every implemented class traceable to an analysis decision.</text><text x="70" y="964" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#64748B">oop-course · Module 14 · Course references: Inggriani Liem + OpenStax</text><text x="1515" y="964" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="60